[name="Google Inc. Stadia Controller" vendor=18d1 product=9400]

name = "Google Stadia Controller"
devname = "stadia_"
exclusive = "true"
change_permissions = "true"
flatten = "false"
rumble = "true"

abs_x = "left_x", "Left stick X axis"
abs_y = "left_y", "Left stick Y axis"

abs_z = "right_x", "Right stick X axis"
abs_rz = "right_y", "Right stick Y axis"

abs_brake = "l2_axis", "Left trigger (L2) axis"
btn_trigger_happy4 = "l2_button", "Left trigger (L2) button"

abs_gas = "r2_axis", "Right trigger (R2) axis"
btn_trigger_happy3 = "r2_button", "Right trigger (R2) button"

btn_tl = "l1", "Left bumper (L1) button"
btn_tr = "r1", "Right bumper (R1) button"

btn_thumbl = "thumbl", "Left stick click"
btn_thumbr = "thumbr", "Right stick click"

abs_hat0x = "leftright", "D-pad X axis"
abs_hat0y = "updown", "D-pad Y axis"

btn_select = "select", "Select button"
btn_start = "start", "Start button"
btn_trigger_happy1 = "assistant", "Assistant button"
btn_trigger_happy2 = "screenshot", "Screenshot button"

btn_south = "a", "A face button"
btn_east = "b", "B face button"
btn_north = "x", "X face button"
btn_west = "y", "Y face button"

btn_mode = "mode", "Mode button"

alias primary a
alias secondary b
alias third x
alias fourth y

alias tl l1
alias tr r1
alias tl2_axis l2_axis
alias tl2_axis_btn l2_button
alias tr2_axis r2_axis
alias tr2_axis_btn r2_button
