FEATURES="buildpkg parallel-install -ebuild-locks -merge-wait -merge-sync"
ACCEPT_KEYWORDS="amd64"

CFLAGS="-march=x86-64-v3 -O2 -pipe"
CXXFLAGS="$CFLAGS"
FCFLAGS="$CFLAGS"
FFLAGS="$CFLAGS"
RUSTFLAGS="-C target-cpu=x86-64-v3"

MAKEOPTS="-j 16 -l 16"

L10N="C"

CPU_FLAGS_X86="aes mmx mmxext sse sse2 sse3 sse4_1 sse4_2 ssse3 avx avx2 f16c fma3 pclmul popcnt rdrand"
VIDEO_CARDS="amdgpu radeonsi radeon"

LLVM_TARGETS="X86 BPF AMDGPU WebAssembly"
LUA_SINGLE_TARGET="luajit"
LUA_TARGETS="luajit"
POSTGRES_TARGETS="postgres18"

USE="-nls -polkit -debuginfod lto dbus fish-completion pulseaudio udev vaapi vulkan wayland -cups -gnome -qt -seccomp -sendmail -vala"

CARGO_TERM_VERBOSE=false
CMAKE_VERBOSE=OFF
NINJA_VERBOSE=OFF

GENTOO_MIRRORS="https://gb.mirrors.cicku.me/gentoo"

INSTALL_MASK="
	/usr/lib/systemd
	/usr/lib/tmpfiles.d
"
