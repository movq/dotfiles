# These settings were set by the catalyst build script that automatically
# built this stage.
# Please consult /usr/share/portage/config/make.conf.example for a more
# detailed example.
COMMON_FLAGS="-march=native -O2 -ftree-vectorize -fvect-cost-model=very-cheap -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# NOTE: This stage was built with the bindist Use flag enabled
PORTDIR="/var/db/repos/gentoo"
DISTDIR="/var/cache/distfiles"
PKGDIR="/var/cache/binpkgs"

# This sets the language of build output to English.
# Please keep this setting intact when reporting bugs.
LC_MESSAGES=C
L10N="en-GB"

GENTOO_MIRRORS="https://mirror.bytemark.co.uk/gentoo/"
ACCEPT_LICENSE="-* @FREE"

CPU_FLAGS_X86="aes mmx mmxext sse sse2 sse3 sse4_1 sse4_2 ssse3 avx avx2"
VIDEO_CARDS="intel"
MAKEOPTS="-j7"
LUA_SINGLE_TARGET="luajit"
LUA_TARGETS="luajit"

USE="clang dbus fish-completion policykit pulseaudio user-session vaapi wayland -cups -gnome-online-accounts -networkmanager -gnome -sendmail -X"
PORTAGE_NICENESS=19
