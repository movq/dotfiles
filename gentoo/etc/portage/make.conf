# These settings were set by the catalyst build script that automatically
# built this stage.
# Please consult /usr/share/portage/config/make.conf.example for a more
# detailed example.
COMMON_FLAGS="-march=skylake -O2 -ftree-vectorize -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
RUSTFLAGS="-C target-cpu=skylake"
MAKEOPTS="-j8"

# NOTE: This stage was built with the bindist Use flag enabled
PORTDIR="/var/db/repos/gentoo"
DISTDIR="/var/cache/distfiles"
PKGDIR="/var/cache/binpkgs"

# This sets the language of build output to English.
# Please keep this setting intact when reporting bugs.
LC_MESSAGES=C
L10N="en-GB"

GENTOO_MIRRORS="https://mirrors.gethosted.online/gentoo"
ACCEPT_LICENSE="-* @FREE"

CPU_FLAGS_X86="aes mmx mmxext sse sse2 sse3 sse4_1 sse4_2 ssse3 avx avx2 f16c fma3 pclmul popcnt rdrand"
VIDEO_CARDS="intel"
LLVM_TARGETS="X86 BPF"
LUA_SINGLE_TARGET="luajit"
LUA_TARGETS="luajit"

USE="lto dbus fish-completion pulseaudio vaapi wayland -cups -gnome -qt -seccomp -sendmail -vala -X"

PORTAGE_NICENESS=19
PORTAGE_BINHOST="http://192.168.1.175/"
FEATURES="buildpkg"

CARGO_TERM_VERBOSE=false
CMAKE_VERBOSE=OFF
NINJA_VERBOSE=OFF
